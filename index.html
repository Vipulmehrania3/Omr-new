<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vipul AI - Intelligence OS</title>
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PrismJS (Syntax Highlighting) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    
    <!-- React & Framer Motion -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Markdown & Zip Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <!-- PrismJS Components -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        deep: '#030305',
                        glass: 'rgba(255, 255, 255, 0.04)',
                        glassBorder: 'rgba(255, 255, 255, 0.08)',
                        neon: { cyan: '#00e5ff', purple: '#b300ff', blue: '#2962ff' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #030305; color: #ffffff; overflow: hidden; -webkit-tap-highlight-color: transparent; }
        #root { height: 100dvh; width: 100vw; display: flex; flex-direction: column; }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel { background: rgba(15, 15, 20, 0.8); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid rgba(255, 255, 255, 0.08); }
        .sidebar-glass { background: rgba(7, 7, 10, 0.85); backdrop-filter: blur(30px); border-right: 1px solid rgba(255, 255, 255, 0.08); }
        
        .chat-input-container { background: rgba(10, 10, 15, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; transition: all 0.3s ease; display: flex; flex-direction: column; position: relative; }
        .chat-input-container:focus-within { border-color: rgba(0, 229, 255, 0.5); box-shadow: 0 0 20px rgba(0, 229, 255, 0.1); background: rgba(15, 15, 20, 0.8); }

        .settings-input, .search-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); padding: 10px 14px; border-radius: 12px; color: #fff; font-size: 0.85rem; transition: all 0.3s ease; }
        .settings-input { font-family: 'JetBrains Mono', monospace; margin-top: 6px; }
        .settings-input:focus, .search-input:focus { outline: none; border-color: #00e5ff; box-shadow: 0 0 15px rgba(0,229,255,0.2); }

        .prose { font-size: 0.95rem; line-height: 1.6; word-wrap: break-word; }
        .prose pre { margin: 0; padding: 1rem; overflow-x: auto; font-size: 0.85rem; background: transparent !important; }
        .prose code { font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.1); padding: 0.2em 0.4em; border-radius: 4px; font-size: 0.85em; }
        .prose pre code { background: transparent; padding: 0; }
        .prose p { margin-bottom: 0.8rem; }
        .prose a { color: #00e5ff; }

        .code-block-wrapper { background: #09090b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; margin: 1rem 0; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .ambient-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 0% 0%, rgba(0, 229, 255, 0.05) 0%, transparent 50%), radial-gradient(circle at 100% 100%, rgba(179, 0, 255, 0.05) 0%, transparent 50%); }

        .thinking-orb { width: 12px; height: 12px; border-radius: 50%; background: #00e5ff; box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff; animation: pulse-glow 1.5s infinite ease-in-out alternate; }
        @keyframes pulse-glow { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px #00e5ff, 0 0 30px #00e5ff; } }
        
        .studio-frame { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const escapedCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
            const lang = language || 'plaintext';
            return `
                <div class="code-block-wrapper">
                    <div class="code-header">
                        <span class="text-xs text-gray-400 font-mono uppercase tracking-wider">${lang}</span>
                        <div class="flex gap-3">
                            <button class="copy-btn text-xs text-gray-400 hover:text-neon-cyan flex items-center gap-1 transition-colors" data-code="${escapedCode}">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy
                            </button>
                            <button class="download-btn text-xs text-gray-400 hover:text-green-400 flex items-center gap-1 transition-colors" data-code="${escapedCode}" data-lang="${lang}">
                                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Save
                            </button>
                        </div>
                    </div>
                    <pre><code class="language-${lang}">${escapedCode}</code></pre>
                </div>
            `;
        };
        marked.setOptions({ renderer });

        const Icons = {
            Menu: () => <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>,
            Send: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>,
            Settings: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>,
            Key: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>,
            ChevronDown: () => <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="6 9 12 15 18 9"></polyline></svg>,
            Sparkle: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 3v18M3 12h18M18.36 5.64l-12.72 12.72M5.64 5.64l12.72 12.72"></path></svg>,
            Code: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>,
            Play: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Download: () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            X: () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        const MODEL_GROUPS = [
            { providerName: "OpenRouter", providerKey: "openrouter", models: [
                { id: "deepseek/deepseek-chat", name: "DeepSeek V3", desc: "Advanced Reasoning" },
                { id: "deepseek/deepseek-coder", name: "DeepSeek Coder", desc: "Coding Specialist" },
                { id: "meta-llama/llama-3-8b-instruct:free", name: "Llama 3 8B (Free)", desc: "Fast & Free Text" }
            ]},
            { providerName: "Groq (Ultra-Fast)", providerKey: "groq", models: [
                { id: "llama3-70b-8192", name: "Llama 3 70B", desc: "Powerful & Fast" },
                { id: "llama3-8b-8192", name: "Llama 3 8B", desc: "Lightning Fast" }
            ]},
            { providerName: "Vision AI", providerKey: "hf", models: [
                { id: "flux-schnell", name: "FLUX.1 Schnell", desc: "Cinematic Image Gen", isImage: true }
            ]}
        ];

        function App() {
            // App & Global State
            const [view, setView] = useState('chat'); // 'chat' or 'studio'
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [modelMenuOpen, setModelMenuOpen] = useState(false);
            const [activeModel, setActiveModel] = useState({ ...MODEL_GROUPS[0].models[0], providerKey: MODEL_GROUPS[0].providerKey });
            
            // Chat State
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);

            // Studio State
            const [studioTab, setStudioTab] = useState('preview');
            const [studioType, setStudioType] = useState('html');
            const [studioCode, setStudioCode] = useState('<!-- Describe what you want to build in the edit bar below -->\n<div style="padding: 20px; font-family: sans-serif; text-align: center; color: #333;">\n  <h2>Welcome to Vip Code Studio</h2>\n  <p>Tell the AI what to build!</p>\n</div>');
            const [studioInput, setStudioInput] = useState('');
            const [isStudioGenerating, setIsStudioGenerating] = useState(false);
            
            const [apiKeys, setApiKeys] = useState(() => {
                const saved = localStorage.getItem('vipul_api_keys');
                return saved ? JSON.parse(saved) : { groq: '', openrouter: '', hf: '' };
            });

            const scrollRef = useRef(null);
            const textareaRef = useRef(null);
            const studioTextareaRef = useRef(null);

            // Copy/Download Listeners
            useEffect(() => {
                const handleGlobalClick = (e) => {
                    const copyBtn = e.target.closest('.copy-btn');
                    if (copyBtn) {
                        navigator.clipboard.writeText(copyBtn.dataset.code);
                        copyBtn.innerHTML = "Copied!";
                        setTimeout(() => copyBtn.innerHTML = "Copy", 2000);
                    }
                    const downloadBtn = e.target.closest('.download-btn');
                    if (downloadBtn) {
                        const ext = downloadBtn.dataset.lang === 'html' ? 'html' : downloadBtn.dataset.lang === 'javascript' ? 'js' : downloadBtn.dataset.lang === 'python' ? 'py' : 'txt';
                        const blob = new Blob([downloadBtn.dataset.code], {type: 'text/plain'});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a'); a.href = url; a.download = `snippet.${ext}`; a.click(); URL.revokeObjectURL(url);
                    }
                };
                document.addEventListener('click', handleGlobalClick);
                return () => document.removeEventListener('click', handleGlobalClick);
            }, []);

            useEffect(() => {
                if (view === 'chat' && scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
                if (window.Prism) window.Prism.highlightAll();
            }, [messages, isGenerating, view, studioCode]);

            useEffect(() => { localStorage.setItem('vipul_api_keys', JSON.stringify(apiKeys)); }, [apiKeys]);

            const handleInput = (e, ref, setter) => {
                setter(e.target.value);
                if (ref.current) {
                    ref.current.style.height = 'auto';
                    ref.current.style.height = `${Math.min(ref.current.scrollHeight, 120)}px`;
                }
            };

            // Normal Chat API
            const handleChatSubmit = async (e) => {
                e?.preventDefault();
                if (!input.trim() || isGenerating) return;

                const userText = input.trim();
                if (!apiKeys[activeModel.providerKey]) {
                    setMessages(prev => [...prev, { role: 'user', content: userText }, { role: 'assistant', content: `⚠️ **API Key Missing!** Add your **${activeModel.providerKey.toUpperCase()}** key in settings.` }]);
                    setInput(''); return;
                }

                setInput('');
                if (textareaRef.current) textareaRef.current.style.height = '40px';
                setModelMenuOpen(false);
                
                const newMsg = { role: 'user', content: userText };
                setMessages(prev => [...prev, newMsg]);
                setIsGenerating(true);

                if (activeModel.isImage || userText.toLowerCase().startsWith('/img')) {
                    const prompt = userText.replace('/img', '').trim() || userText;
                    try {
                        const res = await fetch("https://api-inference.huggingface.co/models/black-forest-labs/FLUX.1-schnell", {
                            method: "POST", headers: { "Authorization": `Bearer ${apiKeys.hf}`, "Content-Type": "application/json" },
                            body: JSON.stringify({ inputs: prompt })
                        });
                        if(!res.ok) throw new Error("Image gen failed");
                        const blob = await res.blob();
                        setMessages(prev => [...prev, { role: 'assistant', content: `**Model:** ${activeModel.name}\n**Prompt:** ${prompt}`, image: URL.createObjectURL(blob) }]);
                    } catch (err) {
                        setMessages(prev => [...prev, { role: 'assistant', content: "⚠️ Image generation failed." }]);
                    }
                    setIsGenerating(false); return;
                }

                const endpoint = activeModel.providerKey === 'groq' ? "https://api.groq.com/openai/v1/chat/completions" : "https://openrouter.ai/api/v1/chat/completions";
                
                try {
                    const response = await fetch(endpoint, {
                        method: "POST", headers: { "Authorization": `Bearer ${apiKeys[activeModel.providerKey]}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: activeModel.id, messages: [{role:'system', content:'You are Vipul AI. Format code elegantly with markdown.'}, ...messages.map(m=>({role:m.role,content:m.content})), newMsg], stream: true })
                    });
                    if (!response.ok) throw new Error("API Error");

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    let textBuffer = '';
                    setMessages(prev => [...prev, { role: 'assistant', content: '' }]);

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n').filter(line => line.trim() !== '');
                        for (const line of lines) {
                            if (line.includes('[DONE]')) continue;
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.replace('data: ', ''));
                                    if (data.choices[0].delta.content) {
                                        textBuffer += data.choices[0].delta.content;
                                        setMessages(prev => { const newMsgs = [...prev]; newMsgs[newMsgs.length - 1].content = textBuffer; return newMsgs; });
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (error) {
                    setMessages(prev => { const newMsgs = [...prev]; newMsgs[newMsgs.length - 1].content = `⚠️ Error connecting to ${activeModel.name}.`; return newMsgs; });
                }
                setIsGenerating(false);
            };

            // Studio Edit API
            const handleStudioSubmit = async (e) => {
                e?.preventDefault();
                if (!studioInput.trim() || isStudioGenerating) return;

                if (!apiKeys[activeModel.providerKey]) {
                    alert(`Missing API Key for ${activeModel.providerKey.toUpperCase()}. Add it in settings.`);
                    return;
                }
                
                // Prevent Image model selection in Code Studio
                if (activeModel.isImage) {
                    alert("Please select a text/coding model (like DeepSeek or Llama) to edit code.");
                    return;
                }

                const userRequest = studioInput.trim();
                setStudioInput('');
                if (studioTextareaRef.current) studioTextareaRef.current.style.height = '40px';
                setModelMenuOpen(false);
                setIsStudioGenerating(true);

                const sysPrompt = studioType === 'html' 
                    ? "You are Vip Code Studio AI. You strictly modify the user's provided HTML code based on their request. Output ONLY the raw, completely updated HTML code inside ```html ... ``` blocks. Do not output any other text or explanations."
                    : "You are Vip Code Studio AI. Build a comprehensive Single Page Web App embedded in one HTML file (HTML/Tailwind/JS). Update the user's code based on request. Output ONLY the complete, production-ready HTML code inside ```html ... ``` blocks. No explanations.";

                const prompt = `Current Code:\n\`\`\`html\n${studioCode}\n\`\`\`\n\nUser Request: ${userRequest}\n\nReturn the ENTIRE updated HTML code.`;
                const endpoint = activeModel.providerKey === 'groq' ? "https://api.groq.com/openai/v1/chat/completions" : "https://openrouter.ai/api/v1/chat/completions";

                try {
                    const response = await fetch(endpoint, {
                        method: "POST", headers: { "Authorization": `Bearer ${apiKeys[activeModel.providerKey]}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ model: activeModel.id, messages: [{role:'system', content:sysPrompt}, {role:'user', content:prompt}] })
                    });
                    if (!response.ok) throw new Error("API Error");
                    const data = await response.json();
                    let aiText = data.choices[0].message.content;
                    
                    const codeMatch = aiText.match(/```(?:html)?\n([\s\S]*?)```/);
                    if (codeMatch && codeMatch[1]) {
                        setStudioCode(codeMatch[1].trim());
                    } else if(aiText.includes('<html') || aiText.includes('<div')) {
                        setStudioCode(aiText.replace(/```html/g, '').replace(/```/g, '').trim());
                    }
                    setStudioTab('preview');
                } catch (err) {
                    alert(`Engine Error (${activeModel.name}). Ensure API key is valid.`);
                }
                setIsStudioGenerating(false);
            };

            const downloadWebApp = () => {
                if (studioType === 'html') {
                    const blob = new Blob([studioCode], {type: 'text/html'});
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = 'index.html'; a.click();
                } else {
                    const zip = new JSZip();
                    zip.file("index.html", studioCode);
                    zip.generateAsync({type:"blob"}).then(function(content) {
                        const url = URL.createObjectURL(content);
                        const a = document.createElement('a'); a.href = url; a.download = 'vipul-webapp.zip'; a.click();
                    });
                }
            };

            // Render Model Dropdown Component (reusable)
            const ModelDropdown = () => (
                <AnimatePresence>
                    {modelMenuOpen && (
                        <motion.div initial={{ opacity: 0, y: 10, scale: 0.95 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 10, scale: 0.95 }} transition={{ duration: 0.15 }} className="absolute bottom-full left-0 w-full bg-[#111116] border border-glassBorder rounded-2xl shadow-2xl mb-3 z-50 overflow-hidden flex flex-col max-h-[50vh]">
                            <div className="p-3 border-b border-glassBorder bg-white/5 font-bold text-sm text-white">Select AI Engine</div>
                            <div className="overflow-y-auto p-2 space-y-4">
                                {MODEL_GROUPS.map((group) => (
                                    <div key={group.providerKey} className="px-1"><div className="text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1.5 px-2">{group.providerName}</div>
                                        <div className="space-y-1">{group.models.map((m) => (
                                            <button key={m.id} type="button" onClick={() => { setActiveModel({...m, providerKey: group.providerKey}); setModelMenuOpen(false); }} className={`w-full flex flex-col items-start p-2.5 rounded-xl text-left transition-all ${activeModel.id === m.id ? (view === 'studio' ? 'bg-neon-purple/15 border border-neon-purple/30 text-neon-purple' : 'bg-neon-cyan/15 border border-neon-cyan/30 text-neon-cyan') : 'border border-transparent hover:bg-white/5 text-gray-300'}`}><div className="text-sm font-semibold">{m.name}</div><div className="text-xs text-gray-500">{m.desc}</div></button>
                                        ))}</div>
                                    </div>
                                ))}
                            </div>
                        </motion.div>
                    )}
                </AnimatePresence>
            );

            return (
                <div className="w-full h-full flex flex-col relative bg-deep font-sans">
                    <div className="ambient-bg"></div>

                    {/* App Header */}
                    <header className="flex-shrink-0 h-14 px-4 flex items-center justify-between border-b border-glassBorder bg-[#030305]/80 backdrop-blur-md z-30">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setSidebarOpen(true)} className="p-1.5 text-gray-300 hover:text-white transition-colors">
                                <Icons.Menu />
                            </button>
                            <span className="font-bold tracking-wide text-lg bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                                Vipul AI {view === 'studio' && <span className="text-neon-purple text-xs uppercase tracking-widest ml-1 border border-neon-purple/50 px-2 py-0.5 rounded-full">Studio</span>}
                            </span>
                        </div>
                        {view === 'chat' ? (
                            <button onClick={() => setSettingsOpen(true)} className="p-1.5 text-gray-400 hover:text-neon-cyan transition-colors"><Icons.Settings /></button>
                        ) : (
                            <button onClick={() => setView('chat')} className="p-1.5 text-gray-400 hover:text-red-400 transition-colors flex items-center gap-1 text-sm font-medium"><Icons.X /> Close</button>
                        )}
                    </header>

                    {/* Sidebar Overlay */}
                    <AnimatePresence>
                        {sidebarOpen && (
                            <>
                                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 bg-black/70 backdrop-blur-sm z-40" onClick={() => setSidebarOpen(false)} />
                                <motion.div initial={{ x: "-100%" }} animate={{ x: 0 }} exit={{ x: "-100%" }} transition={{ type: "spring", damping: 25, stiffness: 200 }} className="fixed top-0 left-0 h-full w-[290px] sidebar-glass z-50 flex flex-col shadow-2xl">
                                    <div className="p-4 border-b border-glassBorder flex items-center gap-3 bg-white/5">
                                        <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-neon-cyan to-neon-purple flex items-center justify-center font-bold text-lg shadow-[0_0_15px_rgba(0,229,255,0.3)]">V</div>
                                        <div><div className="font-bold text-sm tracking-wide text-white">Vipul Aspirant</div><div className="text-[10px] text-neon-cyan uppercase tracking-widest font-mono">Premium OS</div></div>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-3 space-y-4 custom-scrollbar">
                                        <button onClick={() => { setView('studio'); setSidebarOpen(false); }} className="w-full py-4 px-4 rounded-xl bg-gradient-to-r from-neon-purple/20 to-transparent border border-neon-purple/30 flex items-center justify-between group hover:border-neon-purple transition-all shadow-[0_0_20px_rgba(179,0,255,0.1)]">
                                            <div className="flex items-center gap-3 text-neon-purple"><Icons.Code /><div className="text-left"><div className="font-bold text-sm text-white group-hover:text-neon-purple transition-colors">Vip Code Studio</div><div className="text-[10px] uppercase tracking-wider text-gray-400">Build Apps Instantly</div></div></div>
                                            <Icons.Play />
                                        </button>

                                        <button onClick={() => { setMessages([]); setView('chat'); setSidebarOpen(false); }} className="w-full py-2.5 px-3 rounded-xl bg-white/5 border border-white/10 flex items-center gap-3 hover:border-neon-cyan/50 transition-colors">
                                            <div className="text-neon-cyan"><svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                                            <span className="text-sm font-medium text-white">New Chat Session</span>
                                        </button>
                                    </div>

                                    <div className="p-4 border-t border-glassBorder bg-[#050508]">
                                        <button onClick={() => { setSettingsOpen(true); setSidebarOpen(false); }} className="w-full py-2.5 px-3 rounded-xl bg-white/5 border border-white/10 hover:bg-white/10 flex items-center gap-2 text-sm font-medium transition-colors text-white">
                                            <Icons.Settings /> Settings & Keys
                                        </button>
                                    </div>
                                </motion.div>
                            </>
                        )}
                    </AnimatePresence>

                    {/* Settings Modal */}
                    <AnimatePresence>
                        {settingsOpen && (
                            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="absolute inset-0 bg-black/80 backdrop-blur-md" onClick={() => setSettingsOpen(false)} />
                                <motion.div initial={{ scale: 0.9, opacity: 0, y: 20 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.9, opacity: 0, y: 20 }} className="bg-[#0f0f14] border border-glassBorder w-full max-w-sm rounded-3xl shadow-2xl relative z-10 p-6">
                                    <div className="flex items-center gap-3 mb-6 border-b border-white/10 pb-4 text-neon-cyan"><Icons.Key /> <h2 className="text-xl font-bold text-white">API Integration</h2></div>
                                    <div className="space-y-5 max-h-[60vh] overflow-y-auto pr-2">
                                        <div><label className="text-xs text-gray-400 font-bold uppercase tracking-wider">OpenRouter Key (DeepSeek)</label><input type="password" value={apiKeys.openrouter} onChange={e => setApiKeys({...apiKeys, openrouter: e.target.value})} className="settings-input focus:border-neon-cyan" /></div>
                                        <div><label className="text-xs text-gray-400 font-bold uppercase tracking-wider">Groq Key (Llama 3)</label><input type="password" value={apiKeys.groq} onChange={e => setApiKeys({...apiKeys, groq: e.target.value})} className="settings-input focus:border-neon-purple" /></div>
                                        <div><label className="text-xs text-gray-400 font-bold uppercase tracking-wider">Hugging Face Key (Vision)</label><input type="password" value={apiKeys.hf} onChange={e => setApiKeys({...apiKeys, hf: e.target.value})} className="settings-input focus:border-blue-500" /></div>
                                    </div>
                                    <button onClick={() => setSettingsOpen(false)} className="w-full mt-8 py-3 rounded-xl bg-white text-black font-bold text-sm hover:bg-gray-200 active:scale-95 transition-all">Save & Close</button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* --- VIEW ROUTER --- */}
                    {view === 'chat' ? (
                        <>
                            <main ref={scrollRef} className="flex-1 overflow-y-auto p-4 md:p-6 scroll-smooth z-10 pb-6 relative">
                                {messages.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-center max-w-md mx-auto px-2">
                                        <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-neon-cyan/20 to-neon-purple/20 border border-white/10 flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(0,229,255,0.15)]"><Icons.Sparkle /></div>
                                        <h2 className="text-2xl font-bold mb-2">Vipul OS Active</h2>
                                        <p className="text-sm text-gray-400 mb-8">Accessing advanced reasoning modules.</p>
                                    </div>
                                ) : (
                                    <div className="flex flex-col gap-6 max-w-3xl mx-auto">
                                        {messages.map((msg, idx) => (
                                            <motion.div key={idx} initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }} className={`flex gap-3 w-full ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                                                <div className={`w-8 h-8 rounded-full flex-shrink-0 flex items-center justify-center ${msg.role === 'user' ? 'bg-[#1a1a24] border border-white/10' : 'bg-gradient-to-tr from-neon-cyan to-blue-500 shadow-[0_0_10px_rgba(0,229,255,0.3)]'}`}>
                                                    {msg.role === 'user' ? <span className="text-xs font-bold text-white">V</span> : <Icons.Sparkle />}
                                                </div>
                                                <div className={`max-w-[100%] md:max-w-[85%] rounded-2xl p-4 shadow-sm w-full ${msg.role === 'user' ? 'bg-white/5 border border-white/10' : 'bg-transparent'}`}>
                                                    {msg.image && <img src={msg.image} alt="AI Gen" className="w-full rounded-lg mb-3 border border-white/10" />}
                                                    {msg.content ? (
                                                        <div className="prose prose-invert max-w-none" dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }} />
                                                    ) : (
                                                        <div className="h-6 flex items-center"><div className="thinking-orb"></div></div>
                                                    )}
                                                </div>
                                            </motion.div>
                                        ))}
                                    </div>
                                )}
                            </main>

                            <div className="flex-shrink-0 w-full glass-panel p-3 pb-safe z-30 relative">
                                <div className="max-w-3xl mx-auto relative">
                                    <ModelDropdown />
                                    <form onSubmit={handleChatSubmit} className="chat-input-container p-1">
                                        <div className="flex items-center justify-between px-3 pt-2 pb-1">
                                            <button type="button" onClick={() => setModelMenuOpen(!modelMenuOpen)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-gray-300 transition-colors border border-white/5">
                                                <span className={`w-2 h-2 rounded-full ${apiKeys[activeModel.providerKey] ? 'bg-green-400 shadow-[0_0_8px_#4ade80]' : 'bg-red-500'} mr-1`}></span>
                                                {activeModel.name} <Icons.ChevronDown />
                                            </button>
                                        </div>
                                        <div className="flex items-end gap-2 p-1.5">
                                            <textarea ref={textareaRef} value={input} onChange={(e) => handleInput(e, textareaRef, setInput)} onFocus={() => setModelMenuOpen(false)} onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleChatSubmit(); } }} placeholder={`Message ${activeModel.name}...`} className="w-full bg-transparent border-none focus:ring-0 resize-none text-white placeholder-gray-500 py-2 px-2 text-[16px] m-0" style={{ height: '40px', minHeight: '40px' }} />
                                            <button type="submit" disabled={!input.trim() || isGenerating} className="p-2.5 rounded-xl bg-white/10 text-white disabled:opacity-30 flex-shrink-0 active:scale-95 transition-all border border-white/10 hover:bg-white/20"><Icons.Send /></button>
                                        </div>
                                    </form>
                                    <div className="text-center mt-2 text-[10px] text-gray-500 font-mono tracking-widest">VIPUL AI • ENGINE ACTIVE</div>
                                </div>
                            </div>
                        </>
                    ) : (
                        /* VIP CODE STUDIO VIEW */
                        <div className="flex-1 flex flex-col bg-[#050508] relative">
                            {/* Studio Header Options */}
                            <div className="flex-shrink-0 p-3 flex items-center justify-between border-b border-white/5 bg-white/5 backdrop-blur-md z-10">
                                <div className="flex p-1 bg-black/50 rounded-xl border border-white/10">
                                    <button onClick={() => setStudioTab('preview')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 ${studioTab === 'preview' ? 'bg-white/20 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}><Icons.Play /> Preview</button>
                                    <button onClick={() => setStudioTab('code')} className={`px-4 py-1.5 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 ${studioTab === 'code' ? 'bg-white/20 text-white shadow-lg' : 'text-gray-400 hover:text-white'}`}><Icons.Code /> Code</button>
                                </div>
                                <div className="flex items-center gap-2">
                                    <select value={studioType} onChange={(e) => setStudioType(e.target.value)} className="bg-transparent text-xs font-bold uppercase tracking-wider text-neon-purple border-none focus:ring-0 cursor-pointer">
                                        <option value="html" className="bg-black">Single HTML</option>
                                        <option value="webapp" className="bg-black">Full Web App</option>
                                    </select>
                                    <button onClick={downloadWebApp} className="p-2 rounded-lg bg-neon-purple/20 text-neon-purple hover:bg-neon-purple/40 transition-colors" title="Export Project"><Icons.Download /></button>
                                </div>
                            </div>

                            {/* Main Studio Area */}
                            <div className="flex-1 relative overflow-hidden bg-white">
                                {studioTab === 'preview' ? (
                                    <iframe srcDoc={studioCode} className="studio-frame" sandbox="allow-scripts allow-modals allow-forms"></iframe>
                                ) : (
                                    <div className="absolute inset-0 bg-[#09090b] overflow-y-auto p-4 custom-scrollbar text-sm">
                                        <pre><code className="language-html">{studioCode}</code></pre>
                                    </div>
                                )}
                            </div>

                            {/* Studio AI Edit Bar */}
                            <div className="flex-shrink-0 p-3 bg-black/80 backdrop-blur-xl border-t border-white/10 relative">
                                <div className="max-w-3xl mx-auto relative">
                                    <ModelDropdown />
                                    <form onSubmit={handleStudioSubmit} className="chat-input-container p-1 border-neon-purple/30 focus-within:border-neon-purple/60 focus-within:box-shadow-[0_0_20px_rgba(179,0,255,0.2)]">
                                        <div className="flex items-center justify-between px-3 pt-2 pb-1">
                                            <button type="button" onClick={() => setModelMenuOpen(!modelMenuOpen)} className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-gray-300 transition-colors border border-white/5">
                                                <span className={`w-2 h-2 rounded-full ${apiKeys[activeModel.providerKey] ? 'bg-green-400 shadow-[0_0_8px_#4ade80]' : 'bg-red-500'} mr-1`}></span>
                                                {activeModel.name} <Icons.ChevronDown />
                                            </button>
                                            <div className="text-[10px] text-neon-purple uppercase font-bold tracking-widest flex items-center gap-1">
                                                <Icons.Sparkle /> AI Editor
                                            </div>
                                        </div>
                                        <div className="flex items-end gap-2 p-1.5">
                                            <textarea ref={studioTextareaRef} value={studioInput} onChange={(e) => handleInput(e, studioTextareaRef, setStudioInput)} onFocus={() => setModelMenuOpen(false)} onKeyDown={(e) => { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleStudioSubmit(); } }} placeholder="e.g., 'Make the header red and add animation'..." className="w-full bg-transparent border-none focus:ring-0 resize-none text-white placeholder-gray-500 py-2 px-2 text-[15px] m-0" style={{ height: '40px', minHeight: '40px' }} />
                                            <button type="submit" disabled={!studioInput.trim() || isStudioGenerating} className="p-2.5 rounded-xl bg-neon-purple/30 text-white disabled:opacity-30 flex-shrink-0 active:scale-95 transition-all border border-neon-purple/50 hover:bg-neon-purple/50">
                                                {isStudioGenerating ? <div className="w-4 h-4 rounded-full border-2 border-white/30 border-t-white animate-spin"></div> : <Icons.Send />}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
