<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serenity Spa - Massage Therapy Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Georgia', serif;
            background: #0a0a0a;
        }

        #gameCanvas {
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }

        /* Title Screen */
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 30%, #1a3a2e 60%, #0a1a2e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        #title-screen h1 {
            font-size: 4em;
            color: #e8d5b7;
            text-shadow: 0 0 30px rgba(232, 213, 183, 0.5);
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        #title-screen .subtitle {
            font-size: 1.3em;
            color: #b89a7a;
            margin-bottom: 50px;
            letter-spacing: 3px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(232, 213, 183, 0.3); }
            to { text-shadow: 0 0 40px rgba(232, 213, 183, 0.7), 0 0 80px rgba(232, 213, 183, 0.3); }
        }

        .btn {
            padding: 15px 50px;
            font-size: 1.2em;
            font-family: 'Georgia', serif;
            border: 2px solid #e8d5b7;
            background: rgba(232, 213, 183, 0.1);
            color: #e8d5b7;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s;
            margin: 10px;
            letter-spacing: 2px;
        }

        .btn:hover {
            background: rgba(232, 213, 183, 0.3);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(232, 213, 183, 0.3);
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: none;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-panel {
            background: rgba(20, 10, 30, 0.85);
            border: 1px solid rgba(232, 213, 183, 0.3);
            border-radius: 15px;
            padding: 15px 25px;
            color: #e8d5b7;
            backdrop-filter: blur(10px);
        }

        .stat-bar {
            display: flex;
            align-items: center;
            margin: 5px 0;
            gap: 10px;
        }

        .stat-bar label {
            font-size: 0.85em;
            width: 80px;
            color: #b89a7a;
        }

        .bar-container {
            width: 150px;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .bar-fill.relaxation { background: linear-gradient(90deg, #4a9eff, #7bc8ff); }
        .bar-fill.satisfaction { background: linear-gradient(90deg, #ff6b9d, #ffa3c4); }
        .bar-fill.energy { background: linear-gradient(90deg, #ffd700, #ffed4a); }
        .bar-fill.mood { background: linear-gradient(90deg, #50c878, #7ddf9e); }

        #coins-display {
            font-size: 1.2em;
            color: #ffd700;
        }

        /* Dialogue Box */
        #dialogue-box {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 800px;
            background: rgba(15, 8, 25, 0.92);
            border: 1px solid rgba(232, 213, 183, 0.4);
            border-radius: 20px;
            padding: 25px 30px;
            display: none;
            backdrop-filter: blur(15px);
        }

        #speaker-name {
            font-size: 1.1em;
            color: #ffa3c4;
            margin-bottom: 8px;
            font-weight: bold;
        }

        #dialogue-text {
            font-size: 1em;
            color: #e8d5b7;
            line-height: 1.6;
            min-height: 50px;
        }

        #dialogue-choices {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .choice-btn {
            padding: 10px 20px;
            font-size: 0.95em;
            font-family: 'Georgia', serif;
            border: 1px solid rgba(232, 213, 183, 0.3);
            background: rgba(232, 213, 183, 0.08);
            color: #e8d5b7;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            text-align: left;
        }

        .choice-btn:hover {
            background: rgba(232, 213, 183, 0.2);
            border-color: rgba(232, 213, 183, 0.6);
            padding-left: 30px;
        }

        /* Therapist Selection */
        #therapist-select {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #therapist-select h2 {
            font-size: 2.5em;
            color: #e8d5b7;
            margin-bottom: 40px;
        }

        .therapist-grid {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
        }

        .therapist-card {
            width: 250px;
            background: rgba(30, 15, 45, 0.9);
            border: 2px solid rgba(232, 213, 183, 0.2);
            border-radius: 20px;
            padding: 25px;
            cursor: pointer;
            transition: all 0.4s;
            text-align: center;
        }

        .therapist-card:hover {
            transform: translateY(-10px);
            border-color: rgba(232, 213, 183, 0.6);
            box-shadow: 0 15px 40px rgba(232, 213, 183, 0.15);
        }

        .therapist-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }

        .therapist-card h3 {
            color: #ffa3c4;
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .therapist-card .specialty {
            color: #b89a7a;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .therapist-card .desc {
            color: #8a7a6a;
            font-size: 0.85em;
            line-height: 1.4;
        }

        .therapist-card .price {
            color: #ffd700;
            font-size: 1.1em;
            margin-top: 10px;
        }

        /* Massage UI */
        #massage-ui {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        .massage-btn {
            padding: 12px 25px;
            font-size: 0.95em;
            font-family: 'Georgia', serif;
            border: 1px solid rgba(232, 213, 183, 0.3);
            background: rgba(20, 10, 35, 0.85);
            color: #e8d5b7;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .massage-btn:hover {
            background: rgba(232, 213, 183, 0.2);
            transform: scale(1.05);
        }

        .massage-btn.active {
            border-color: #ffa3c4;
            background: rgba(255, 163, 196, 0.15);
        }

        /* Timer */
        #session-timer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5em;
            color: #e8d5b7;
            display: none;
            background: rgba(20, 10, 30, 0.85);
            padding: 8px 25px;
            border-radius: 20px;
            border: 1px solid rgba(232, 213, 183, 0.3);
        }

        /* Notification */
        .notification {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 10, 35, 0.9);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1em;
            animation: slideDown 0.5s ease, fadeOut 0.5s ease 2s forwards;
            z-index: 200;
        }

        @keyframes slideDown {
            from { top: 40px; opacity: 0; }
            to { top: 80px; opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; top: 60px; }
        }

        /* Back button */
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 0.9em;
            font-family: 'Georgia', serif;
            border: 1px solid rgba(232, 213, 183, 0.3);
            background: rgba(20, 10, 35, 0.85);
            color: #e8d5b7;
            cursor: pointer;
            border-radius: 10px;
            display: none;
            z-index: 60;
        }

        /* Story progress indicator */
        #story-progress {
            position: absolute;
            bottom: 10px;
            right: 20px;
            color: rgba(232, 213, 183, 0.4);
            font-size: 0.8em;
            display: none;
        }

        /* Loading */
        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        /* Chapter screen */
        #chapter-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 2, 10, 0.97);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 80;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #chapter-screen h2 {
            font-size: 1.2em;
            color: #b89a7a;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        #chapter-screen h1 {
            font-size: 3em;
            color: #e8d5b7;
            text-shadow: 0 0 30px rgba(232, 213, 183, 0.3);
        }

        /* Lobby navigation */
        #lobby-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 15px;
        }

        .lobby-btn {
            padding: 12px 30px;
            font-size: 1em;
            font-family: 'Georgia', serif;
            border: 1px solid rgba(232, 213, 183, 0.4);
            background: rgba(20, 10, 35, 0.85);
            color: #e8d5b7;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .lobby-btn:hover {
            background: rgba(232, 213, 183, 0.2);
            transform: translateY(-3px);
        }

        /* Emote particles */
        .emote-particle {
            position: absolute;
            font-size: 2em;
            animation: floatUp 2s ease-out forwards;
            pointer-events: none;
            z-index: 150;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateY(-50px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-100px) scale(0.8); }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
    <!-- Title Screen -->
    <div id="title-screen">
        <h1>✨ Serenity Spa ✨</h1>
        <p class="subtitle">MASSAGE THERAPY SIMULATOR</p>
        <button class="btn" onclick="startGame()">Begin Journey</button>
        <button class="btn" onclick="showCredits()" style="font-size:0.9em; padding:10px 30px; margin-top:5px;">About</button>
    </div>

    <!-- Chapter Screen -->
    <div id="chapter-screen">
        <h2 id="chapter-label">CHAPTER 1</h2>
        <h1 id="chapter-title">A New Beginning</h1>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div class="hud-panel">
            <div class="stat-bar">
                <label>Relaxation</label>
                <div class="bar-container"><div class="bar-fill relaxation" id="bar-relaxation" style="width:20%"></div></div>
            </div>
            <div class="stat-bar">
                <label>Satisfaction</label>
                <div class="bar-container"><div class="bar-fill satisfaction" id="bar-satisfaction" style="width:0%"></div></div>
            </div>
            <div class="stat-bar">
                <label>Energy</label>
                <div class="bar-container"><div class="bar-fill energy" id="bar-energy" style="width:100%"></div></div>
            </div>
            <div class="stat-bar">
                <label>Mood</label>
                <div class="bar-container"><div class="bar-fill mood" id="bar-mood" style="width:50%"></div></div>
            </div>
        </div>
        <div class="hud-panel">
            <div id="coins-display">💰 500 Gold</div>
            <div style="color:#b89a7a; font-size:0.85em; margin-top:5px;" id="day-display">Day 1</div>
        </div>
    </div>

    <!-- Session Timer -->
    <div id="session-timer">⏱ 5:00</div>

    <!-- Therapist Selection -->
    <div id="therapist-select">
        <h2>Choose Your Therapist</h2>
        <div class="therapist-grid" id="therapist-grid"></div>
        <button class="btn" onclick="goToLobby()" style="margin-top:30px; font-size:0.9em;">Back to Lobby</button>
    </div>

    <!-- Dialogue Box -->
    <div id="dialogue-box">
        <div id="speaker-name"></div>
        <div id="dialogue-text"></div>
        <div id="dialogue-choices"></div>
    </div>

    <!-- Massage Actions -->
    <div id="massage-ui">
        <div style="color:#b89a7a; text-align:center; margin-bottom:5px; font-size:0.85em;">Techniques</div>
        <button class="massage-btn" onclick="doMassage('swedish')">🖐 Swedish</button>
        <button class="massage-btn" onclick="doMassage('deep')">💪 Deep Tissue</button>
        <button class="massage-btn" onclick="doMassage('hot')">🔥 Hot Stone</button>
        <button class="massage-btn" onclick="doMassage('aroma')">🌸 Aromatherapy</button>
        <button class="massage-btn" onclick="doMassage('shiatsu')">🤲 Shiatsu</button>
        <button class="massage-btn" onclick="talkDuring()">💬 Talk</button>
    </div>

    <!-- Lobby Navigation -->
    <div id="lobby-nav">
        <button class="lobby-btn" onclick="showTherapistSelect()">🧖‍♀️ Book Session</button>
        <button class="lobby-btn" onclick="visitShop()">🛍 Gift Shop</button>
        <button class="lobby-btn" onclick="viewJournal()">📖 Journal</button>
        <button class="lobby-btn" onclick="rest()">🌙 Rest</button>
    </div>

    <button id="back-btn" onclick="goToLobby()">← Back</button>

    <div id="story-progress"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==========================================
// GAME ENGINE
// ==========================================

let scene, camera, renderer, clock;
let gameState = {
    phase: 'title', // title, lobby, selecting, session, dialogue
    day: 1,
    coins: 500,
    stats: {
        relaxation: 20,
        satisfaction: 0,
        energy: 100,
        mood: 50
    },
    currentTherapist: null,
    relationships: {},
    storyProgress: {},
    unlockedStories: [],
    sessionTime: 300,
    currentChapter: 1,
    journalEntries: [],
    giftsGiven: {}
};

// Therapist Data
const therapists = [
    {
        id: 'sakura',
        name: 'Sakura',
        specialty: 'Traditional Japanese Shiatsu',
        desc: 'A gentle soul from Kyoto who believes massage heals both body and spirit. She carries the wisdom of ancient techniques.',
        color: 0xff9eb8,
        skinColor: 0xfdd5b1,
        hairColor: 0x1a1a2e,
        price: 100,
        emoji: '🌸',
        personality: 'gentle',
        stories: {
            intro: [
                { speaker: 'Sakura', text: 'Welcome to our spa. I am Sakura. *bows gracefully* I sense much tension in you...', choices: [
                    { text: 'Thank you, Sakura. I\'ve heard wonderful things about you.', mood: 10, next: 1 },
                    { text: 'I\'ve been really stressed lately. Can you help?', mood: 5, next: 2 }
                ]},
                { speaker: 'Sakura', text: '*smiles warmly* You are too kind. In my homeland, we say "The body speaks what the heart cannot." Let me listen to yours.', choices: [
                    { text: 'That\'s beautiful. Please, I\'m ready.', next: 'start_session' }
                ]},
                { speaker: 'Sakura', text: 'Of course. Stress is like a river blocked by stones. Together, we shall remove them one by one. Please, lie down and breathe deeply.', choices: [
                    { text: 'That sounds wonderful. Let\'s begin.', next: 'start_session' }
                ]}
            ],
            session_talk: [
                { speaker: 'Sakura', text: 'You carry your stress in your shoulders... Tell me, what weighs so heavily on your mind?', choices: [
                    { text: 'Work has been overwhelming lately.', mood: 5, next: 1 },
                    { text: 'I just needed some peace and quiet.', mood: 8, next: 2 }
                ]},
                { speaker: 'Sakura', text: 'Ah, the modern world asks so much of us. But remember - even the busiest cherry blossom tree finds time to bloom. *applies warm pressure to your back*', choices: [
                    { text: 'You\'re very wise, Sakura.', relationship: 5, next: 'resume' }
                ]},
                { speaker: 'Sakura', text: '*nods approvingly* Then you have already taken the first step to healing. The fact that you are here... that takes courage. *gentle strokes along your spine*', choices: [
                    { text: '*Close your eyes and relax*', relationship: 3, next: 'resume' }
                ]}
            ],
            deep: [
                { speaker: 'Sakura', text: '*pauses her work* Can I tell you something? When I first came here from Japan, I was very lonely. This spa... it became my home.', choices: [
                    { text: 'I\'m glad you found your place here.', relationship: 10, next: 1 },
                    { text: 'Do you miss home?', relationship: 8, next: 2 }
                ]},
                { speaker: 'Sakura', text: '*blushes slightly* And now, with clients like you who truly appreciate the art... it makes every day worthwhile. You have a gentle spirit.', choices: [
                    { text: 'You bring out the best in people, Sakura.', relationship: 15, next: 'end' }
                ]},
                { speaker: 'Sakura', text: 'Every day. I miss the cherry blossoms in spring, the temple bells... But I carry them in my heart. *her hands work a deep knot* And I share their peace through my work.', choices: [
                    { text: 'I can feel that peace through your touch.', relationship: 12, next: 'end' }
                ]}
            ]
        }
    },
    {
        id: 'elena',
        name: 'Elena',
        specialty: 'Swedish & Deep Tissue Expert',
        desc: 'A confident professional from Stockholm with strong hands and a warm heart. Known for her incredible deep tissue technique.',
        color: 0x7bc8ff,
        skinColor: 0xfce4d6,
        hairColor: 0xe8c170,
        price: 120,
        emoji: '❄️',
        personality: 'confident',
        stories: {
            intro: [
                { speaker: 'Elena', text: 'Hey there! I\'m Elena. *extends hand for a firm handshake* Ready to let me work my magic? I promise you\'ll feel like a new person.', choices: [
                    { text: 'I like your confidence! Let\'s do this.', mood: 10, next: 1 },
                    { text: 'I\'ve never had a professional massage before...', mood: 5, next: 2 }
                ]},
                { speaker: 'Elena', text: '*grins* That\'s the spirit! I was a physiotherapist back in Stockholm. Trust me, these hands know what they\'re doing. Hop on the table!', choices: [
                    { text: 'I\'m in good hands then!', next: 'start_session' }
                ]},
                { speaker: 'Elena', text: '*softens her voice* Don\'t worry! Everyone starts somewhere. I\'ll be gentle - well, mostly gentle. *winks* I\'ll talk you through everything. You\'re safe with me.', choices: [
                    { text: 'Thank you, Elena. That makes me feel better.', next: 'start_session' }
                ]}
            ],
            session_talk: [
                { speaker: 'Elena', text: '*pressing firmly on a knot* Wow, you\'re really tight here. What do you do for a living? Because your muscles are staging a protest.', choices: [
                    { text: '*laugh* I sit at a desk all day.', mood: 5, next: 1 },
                    { text: 'I try to exercise but never stretch properly.', mood: 3, next: 2 }
                ]},
                { speaker: 'Elena', text: '*laughs* Classic! I call this "desk warrior syndrome." Don\'t worry, I\'ll have you loosened up. Back in Sweden, we have a saying: "A stiff body makes a stiff mind."', choices: [
                    { text: 'I can already feel the difference.', relationship: 5, next: 'resume' }
                ]},
                { speaker: 'Elena', text: 'Stretching is the most underrated thing! *works along your shoulders* Tell you what - come back next time and I\'ll show you some amazing stretches. Consider it a bonus.', choices: [
                    { text: 'I\'d love that, Elena!', relationship: 8, next: 'resume' }
                ]}
            ],
            deep: [
                { speaker: 'Elena', text: '*stops and sits beside you* You know... I don\'t usually open up to clients. But you\'re different. You actually listen.', choices: [
                    { text: 'I enjoy our conversations, Elena.', relationship: 10, next: 1 },
                    { text: 'You can tell me anything.', relationship: 12, next: 2 }
                ]},
                { speaker: 'Elena', text: '*runs fingers through her blonde hair* I left Sweden because... I needed to find myself. My family wanted me to be a doctor. But healing people with my hands, one person at a time... this is who I am.', choices: [
                    { text: 'You\'re amazing at what you do. Never doubt that.', relationship: 15, next: 'end' }
                ]},
                { speaker: 'Elena', text: '*takes a deep breath* I was engaged once. He didn\'t understand why I chose this over medicine. But touch... real, healing touch... it\'s an art. And you appreciate that.', choices: [
                    { text: 'His loss. You\'re extraordinary, Elena.', relationship: 18, next: 'end' }
                ]}
            ]
        }
    },
    {
        id: 'maya',
        name: 'Maya',
        specialty: 'Aromatherapy & Hot Stone',
        desc: 'A free-spirited healer from Bali who combines essential oils with ancient volcanic stone techniques. Her presence alone is calming.',
        color: 0x50c878,
        skinColor: 0xc68642,
        hairColor: 0x0d0d0d,
        price: 150,
        emoji: '🌿',
        personality: 'mystical',
        stories: {
            intro: [
                { speaker: 'Maya', text: '*places hands together in prayer* Namaste. I am Maya. The universe has guided you here today... I can see your aura needs healing.', choices: [
                    { text: 'I believe in energy healing. Please help me.', mood: 12, next: 1 },
                    { text: 'I\'m not sure about auras, but I need relaxation.', mood: 5, next: 2 }
                ]},
                { speaker: 'Maya', text: '*lights incense and smiles* Beautiful. Close your eyes... *waves essential oils* Breathe in the lavender and sandalwood. Feel the tension dissolving like morning mist...', choices: [
                    { text: '*Inhale deeply and surrender to the experience*', next: 'start_session' }
                ]},
                { speaker: 'Maya', text: '*laughs gently* The mind questions what the body already knows. You don\'t need to believe - just feel. *places a warm stone on your back* Tell me... does that feel like nothing?', choices: [
                    { text: 'That feels... incredible actually.', next: 'start_session' }
                ]}

// Three.js Setup
function initThreeJS() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.8;
    clock = new THREE.Clock();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

let currentScene = null;
let animatedObjects = [];
let particleSystems = [];

function clearScene() {
    while(scene.children.length > 0) {
        const obj = scene.children[0];
        scene.remove(obj);
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material) {
            if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
        }
    }
    animatedObjects = [];
    particleSystems = [];
}

// ==========================================
// ANIMATION LOOP
// ==========================================

function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    const delta = clock.getDelta();

    // Animate objects
    animatedObjects.forEach(obj => {
        switch(obj.type) {
            case 'bob':
                obj.mesh.position.y += Math.sin(time * obj.speed + obj.offset) * 0.0005;
                break;
            case 'sway':
                obj.mesh.rotation.z = Math.sin(time * obj.speed + obj.offset) * obj.amplitude;
                break;
            case 'flicker':
                const flicker = 0.8 + Math.sin(time * obj.speed + obj.offset) * 0.2 + Math.sin(time * obj.speed * 2.7) * 0.1;
                obj.mesh.scale.y = 1.5 * flicker;
                obj.mesh.scale.x = flicker;
                if(obj.light) obj.light.intensity = 0.2 * flicker;
                break;
            case 'massage_hand':
                obj.mesh.position.x = obj.baseX + Math.sin(time * obj.speed) * 0.1;
                obj.mesh.position.z = obj.baseZ + Math.cos(time * obj.speed * 1.3) * 0.15;
                obj.mesh.position.y = obj.baseY + Math.sin(time * obj.speed * 0.7) * 0.03;
                break;
            case 'massage_arm':
                obj.mesh.rotation.z = obj.baseRotZ + Math.sin(time * obj.speed) * 0.1;
                obj.mesh.rotation.x = 0.5 + Math.sin(time * obj.speed * 1.3) * 0.1;
                break;
            case 'therapist_sway':
                obj.mesh.position.x = 1.3 + Math.sin(time * obj.speed) * 0.05;
                obj.mesh.rotation.y = Math.sin(time * obj.speed * 0.5) * 0.05;
                break;
        }
    });

    // Animate particles
    particleSystems.forEach(ps => {
        const positions = ps.geometry.attributes.position.array;
        for(let i = 1; i < positions.length; i += 3) {
            positions[i] += 0.002;
            if(positions[i] > 5) positions[i] = 0;
        }
        ps.geometry.attributes.position.needsUpdate = true;
    });

    // Gentle camera movement
    if(currentScene === 'lobby') {
        camera.position.x = Math.sin(time * 0.1) * 0.3;
        camera.position.y = 3 + Math.sin(time * 0.15) * 0.1;
        camera.lookAt(0, 1, -2);
    } else if(currentScene === 'massage') {
        camera.position.x = 2 + Math.sin(time * 0.2) * 0.2;
        camera.position.y = 3 + Math.sin(time * 0.15) * 0.1;
        camera.lookAt(0, 1, 0);
    }

    renderer.render(scene, camera);
}

// ==========================================
// GAME LOGIC
// ==========================================

function startGame() {
    document.getElementById('title-screen').style.display = 'none';
    showChapter(1, 'A New Beginning', () => {
        goToLobby();
        showDialogue('Receptionist', 'Welcome to Serenity Spa! ✨ I\'m so glad you decided to visit us. We have three wonderful therapists available today. Each one has their own unique style and story. Take your time choosing!', [
            { text: 'Thank you! I\'m excited to be here.', callback: () => {
                hideDialogue();
                showNotification('💡 Use the buttons below to navigate the spa!');
            }}
        ]);
    });
}

function showChapter(num, title, callback) {
    const screen = document.getElementById('chapter-screen');
    document.getElementById('chapter-label').textContent = `CHAPTER ${num}`;
    document.getElementById('chapter-title').textContent = title;
    screen.style.display = 'flex';

    setTimeout(() => {
        screen.style.display = 'none';
        if(callback) callback();
    }, 3000);
}

function goToLobby() {
    gameState.phase = 'lobby';
    buildLobbyScene();

    document.getElementById('therapist-select').style.display = 'none';
    document.getElementById('massage-ui').style.display = 'none';
    document.getElementById('session-timer').style.display = 'none';
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('lobby-nav').style.display = 'flex';
    document.getElementById('story-progress').style.display = 'none';

    updateHUD();
}

function showTherapistSelect() {
    document.getElementById('lobby-nav').style.display = 'none';
    document.getElementById('therapist-select').style.display = 'flex';

    const grid = document.getElementById('therapist-grid');
    grid.innerHTML = '';

    therapists.forEach(t => {
        const rel = gameState.relationships[t.id] || 0;
        const relStars = '❤️'.repeat(Math.min(Math.floor(rel / 20), 5)) || '🤍';

        const card = document.createElement('div');
        card.className = 'therapist-card';
        card.innerHTML = `
            <div class="therapist-avatar" style="background: radial-gradient(circle, ${hexToCSS(t.color)}, ${hexToCSS(t.color)}33);">
                <span>${t.emoji}</span>
            </div>
            <h3>${t.name}</h3>
            <div class="specialty">${t.specialty}</div>
            <div class="desc">${t.desc}</div>
            <div style="color:#b89a7a; font-size:0.85em; margin-top:8px;">Bond: ${relStars}</div>
            <div class="price">${t.price} Gold</div>
        `;
        card.onclick = () => selectTherapist(t);
        grid.appendChild(card);
    });
}

function selectTherapist(therapist) {
    if(gameState.coins < therapist.price) {
        showNotification('❌ Not enough gold! Rest to earn more.');
        return;
    }

    gameState.coins -= therapist.price;
    gameState.currentTherapist = therapist;

    document.getElementById('therapist-select').style.display = 'none';

    // Initialize relationship if needed
    if(!gameState.relationships[therapist.id]) {
        gameState.relationships[therapist.id] = 0;
    }
    if(!gameState.storyProgress[therapist.id]) {
        gameState.storyProgress[therapist.id] = 'intro';
    }

    buildMassageRoom();

    document.getElementById('hud').style.display = 'flex';
    document.getElementById('lobby-nav').style.display = 'none';

    // Start story
    const storyPhase = gameState.storyProgress[therapist.id];
    startStory(therapist, storyPhase);
}

function startStory(therapist, phase) {
    const story = therapist.stories[phase];
    if(!story || story.length === 0) {
        startSession();
        return;
    }

    playStoryNode(therapist, story, 0);
}

function playStoryNode(therapist, story, index) {
    if(index >= story.length) {
        startSession();
        return;
    }

    const node = story[index];
    const choices = node.choices.map(c => ({
        text: c.text,
        callback: () => {
            if(c.mood) gameState.stats.mood = Math.min(100, gameState.stats.mood + c.mood);
            if(c.relationship) {
                gameState.relationships[therapist.id] = (gameState.relationships[therapist.id] || 0) + c.relationship;
                spawnEmote('❤️');
            }

            if(c.next === 'start_session') {
                hideDialogue();
                startSession();
            } else if(c.next === 'resume') {
                hideDialogue();
                showNotification('💆 Massage continues...');
            } else if(c.next === 'end') {
                hideDialogue();
                advanceStory(therapist);
                showNotification('💖 Your bond with ' + therapist.name + ' has deepened!');
            } else if(typeof c.next === 'number') {
                playStoryNode(therapist, story, c.next);
            }
            updateHUD();
        }
    }));

    showDialogue(node.speaker, node.text, choices);
}

function advanceStory(therapist) {
    const phases = ['intro', 'session_talk', 'deep'];
    const currentPhase = gameState.storyProgress[therapist.id];
    const currentIndex = phases.indexOf(currentPhase);

    if(currentIndex < phases.length - 1) {
        gameState.storyProgress[therapist.id] = phases[currentIndex + 1];
        addJournalEntry(`Grew closer to ${therapist.name}. Our conversations are becoming deeper...`);
    }

    // Check for chapter progression
    const totalProgress = Object.values(gameState.storyProgress).filter(p => p !== 'intro').length;
    if(totalProgress >= 2 && gameState.currentChapter === 1) {
        gameState.currentChapter = 2;
        setTimeout(() => showChapter(2, 'Growing Bonds'), 2000);
    }
    if(totalProgress >= 4 && gameState.currentChapter === 2) {
        gameState.currentChapter = 3;
        setTimeout(() => showChapter(3, 'Heart to Heart'), 2000);
    }
}

let sessionTimer = null;

function startSession() {
    gameState.phase = 'session';
    gameState.sessionTime = 120; // 2 minutes

    document.getElementById('massage-ui').style.display = 'flex';
    document.getElementById('session-timer').style.display = 'block';
    document.getElementById('back-btn').style.display = 'block';
    document.getElementById('story-progress').style.display = 'block';

    const rel = gameState.relationships[gameState.currentTherapist.id] || 0;
    document.getElementById('story-progress').textContent = `Bond: ${rel} | ${gameState.currentTherapist.name}`;

    updateTimer();

    sessionTimer = setInterval(() => {
        gameState.sessionTime--;
        updateTimer();

        // Passive stat gains
        gameState.stats.relaxation = Math.min(100, gameState.stats.relaxation + 0.15);
        gameState.stats.energy = Math.max(0, gameState.stats.energy - 0.05);
        updateHUD();

        if(gameState.sessionTime <= 0) {
            endSession();
        }
    }, 1000);

    showNotification(`✨ Session with ${gameState.currentTherapist.name} has begun!`);
}

function updateTimer() {
    const mins = Math.floor(gameState.sessionTime / 60);
    const secs = gameState.sessionTime % 60;
    document.getElementById('session-timer').textContent = `⏱ ${mins}:${secs.toString().padStart(2, '0')}`;
}

function doMassage(type) {
    if(gameState.phase !== 'session') return;

    const bonuses = {
        swedish: { relaxation: 8, satisfaction: 5, mood: 3 },
        deep: { relaxation: 5, satisfaction: 8, mood: 2 },
        hot: { relaxation: 10, satisfaction: 7, mood: 5 },
        aroma: { relaxation: 7, satisfaction: 6, mood: 8 },
        shiatsu: { relaxation: 6, satisfaction: 9, mood: 4 }
    };

    const bonus = bonuses[type];
    const therapist = gameState.currentTherapist;

    // Apply bonuses (some therapists are better at certain types)
    let multiplier = 1;
    if(therapist.id === 'sakura' && type === 'shiatsu') multiplier = 1.5;
    if(therapist.id === 'elena' && (type === 'swedish' || type === 'deep')) multiplier = 1.5;
    if(therapist.id === 'maya' && (type === 'hot' || type === 'aroma')) multiplier = 1.5;

    gameState.stats.relaxation = Math.min(100, gameState.stats.relaxation + bonus.relaxation * multiplier);
    gameState.stats.satisfaction = Math.min(100, gameState.stats.satisfaction + bonus.satisfaction * multiplier);
    gameState.stats.mood = Math.min(100, gameState.stats.mood + bonus.mood * multiplier);
    gameState.stats.energy = Math.max(0, gameState.stats.energy - 2);

    // Relationship boost
    gameState.relationships[therapist.id] = (gameState.relationships[therapist.id] || 0) + (multiplier > 1 ? 3 : 1);

    const messages = {
        swedish: ['Smooth, flowing strokes ease your tension...', 'Long, rhythmic movements calm your mind...'],
        deep: ['Strong pressure reaches deep into your muscles...', 'Firm kneading releases stubborn knots...'],
        hot: ['Warm stones melt away your stress...', 'The heat penetrates deep into your muscles...'],
        aroma: ['Lavender and eucalyptus fill the air...', 'Essential oils work their magic on your skin...'],
        shiatsu: ['Precise pressure points activate healing energy...', 'Ancient techniques restore your chi flow...']
    };

    const msg = messages[type][Math.floor(Math.random() * messages[type].length)];
    showNotification(`💆 ${msg}`);

    if(multiplier > 1) {
        spawnEmote('⭐');
        setTimeout(() => showNotification(`✨ ${therapist.name}'s specialty! Extra effective!`), 1500);
    }

    // Highlight active button
    document.querySelectorAll('.massage-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    updateHUD();

    // Random therapist comments
    if(Math.random() < 0.3) {
        const comments = {
            sakura: ['*hums a gentle melody*', 'Breathe deeply... let it all go...', 'Your energy is flowing beautifully now...'],
            elena: ['There we go, that knot is releasing!', 'You\'re doing great, just relax!', '*works with confident, strong strokes*'],
            maya: ['The elements are in harmony...', '*whispers a blessing*', 'Your chakras are aligning beautifully...']
        };
        const therapistComments = comments[therapist.id];
        setTimeout(() => {
            showDialogue(therapist.name, therapistComments[Math.floor(Math.random() * therapistComments.length)], [
                { text: '*Enjoy the moment*', callback: hideDialogue }
            ]);
        }, 2000);
    }
}

function talkDuring() {
    if(gameState.phase !== 'session') return;

    const therapist = gameState.currentTherapist;
    const rel = gameState.relationships[therapist.id] || 0;

    // Check if deep story is available
    if(rel >= 30 && gameState.storyProgress[therapist.id] !== 'deep') {
        gameState.storyProgress[therapist.id] = 'deep';
        startStory(therapist, 'deep');
        return;
    }

    if(gameState.storyProgress[therapist.id] === 'intro') {
        gameState.storyProgress[therapist.id] = 'session_talk';
    }

    const phase = gameState.storyProgress[therapist.id];
    const story = therapist.stories[phase];

    if(story) {
        playStoryNode(therapist, story, 0);
    } else {
        // Random conversation
        const randomTalks = {
            sakura: [
                { speaker: 'Sakura', text: 'Did you know that in Japan, there are over 200 types of cherry blossom trees? Each one is unique, like each person who visits me.', choices: [
                    { text: 'That\'s fascinating!', relationship: 2, callback: () => { hideDialogue(); updateHUD(); } }
                ]},
                { speaker: 'Sakura', text: '*smiles* You seem more relaxed today than when you first came. It makes me happy to see your progress.', choices: [
                    { text: 'It\'s all thanks to you, Sakura.', relationship: 3, callback: () => { hideDialogue(); spawnEmote('🌸'); updateHUD(); } }
                ]}
            ],
            elena: [
                { speaker: 'Elena', text: 'You know what I miss about Sweden? The saunas. Nothing beats a good sauna after a long day. We should totally go sometime— I mean, uh, you should try one!', choices: [
                    { text: '*laugh* That sounds like a plan!', relationship: 3, callback: () => { hideDialogue(); spawnEmote('😊'); updateHUD(); } }
                ]},
                { speaker: 'Elena', text: 'I\'ve been thinking about entering a massage therapy competition. Would you... would you want to be my practice partner? You have great muscles to work with!', choices: [
                    { text: 'I\'d be honored, Elena!', relationship: 5, callback: () => { hideDialogue(); spawnEmote('💪'); updateHUD(); } }
                ]}
            ],
            maya: [
                { speaker: 'Maya', text: 'I had a dream about you last night. In Bali, we believe dreams are messages from the spirit world. You were surrounded by golden light...', choices: [
                    { text: 'What does that mean?', relationship: 4, callback: () => { hideDialogue(); spawnEmote('✨'); updateHUD(); } }
                ]},
                { speaker: 'Maya', text: '*places a crystal near you* This amethyst has been charged under the full moon. It will protect your energy even after you leave here.', choices: [
                    { text: 'Thank you, Maya. That means a lot.', relationship: 4, callback: () => { hideDialogue(); spawnEmote('💜'); updateHUD(); } }
                ]}
            ]
        };

        const talks = randomTalks[therapist.id];
        const talk = talks[Math.floor(Math.random() * talks.length)];

        const choices = talk.choices.map(c => ({
            text: c.text,
            callback: () => {
                if(c.relationship) {
                    gameState.relationships[therapist.id] += c.relationship;
                }
                c.callback();
            }
        }));

        showDialogue(talk.speaker, talk.text, choices);
    }
}

function endSession() {
    clearInterval(sessionTimer);
    gameState.phase = 'dialogue';

    document.getElementById('massage-ui').style.display = 'none';
    document.getElementById('session-timer').style.display = 'none';

    const therapist = gameState.currentTherapist;
    const rel = gameState.relationships[therapist.id] || 0;

    // Bonus coins based on stats
    const bonusCoins = Math.floor((gameState.stats.relaxation + gameState.stats.satisfaction) / 10);
    gameState.coins += bonusCoins;

    // End session dialogue
    const endDialogues = {
        sakura: rel > 30 
            ? `*holds your hand gently* Thank you for trusting me today. Every session with you feels like... like coming home. I hope you feel the same way. 🌸`
            : `*bows* Thank you for this session. Your body has released much tension. Please come again soon. Take care of yourself.`,
        elena: rel > 30
            ? `*sits beside you* Hey... I just want you to know that you're not just another client to me. You're... special. *tucks hair behind ear* Same time next week?`
            : `*stretches* Great session! You're really improving. Those knots are getting smaller each time. Keep doing those stretches I showed you!`,
        maya: rel > 30
            ? `*takes both your hands* The universe brought us together for a reason. I feel our energies are intertwined now. This is... rare and precious. 🌿`
            : `*places hands in prayer* The healing energy flows strong in you. The spirits are pleased. Go in peace and carry this light with you.`
    };

    showDialogue(therapist.name, endDialogues[therapist.id], [
        { text: rel > 30 ? 'I feel the same way. Until next time. ❤️' : 'Thank you so much. I feel wonderful!', callback: () => {
            hideDialogue();
            showNotification(`✨ Session complete! +${bonusCoins} Gold earned`);
            addJournalEntry(`Had a ${rel > 30 ? 'deeply meaningful' : 'wonderful'} session with ${therapist.name}. Feeling refreshed.`);
            gameState.stats.energy = Math.max(20, gameState.stats.energy);

            setTimeout(() => {
                goToLobby();
            }, 2000);
        }}
    ]);

    updateHUD();
}

function visitShop() {
    document.getElementById('lobby-nav').style.display = 'none';

    const gifts = [
        { name: '🌹 Rose Bouquet', price: 50, relationship: 10, desc: 'A beautiful bouquet of red roses' },
        { name: '🍫 Chocolate Box', price: 30, relationship: 5, desc: 'Premium Belgian chocolates' },
        { name: '💎 Crystal Pendant', price: 100, relationship: 15, desc: 'A shimmering amethyst pendant' },
        { name: '📚 Poetry Book', price: 40, relationship: 8, desc: 'Classic love poems from around the world' },
        { name: '🧴 Luxury Oil Set', price: 80, relationship: 12, desc: 'Premium essential oil collection' }
    ];

    let choices = gifts.map(g => ({
        text: `${g.name} - ${g.price} Gold (${g.desc})`,
        callback: () => {
            if(gameState.coins >= g.price) {
                gameState.coins -= g.price;
                hideDialogue();
                // Show therapist selection for gift
                showDialogue('Shop Keeper', `Wonderful choice! Who would you like to give the ${g.name} to?`,
                    therapists.map(t => ({
                        text: `${t.emoji} ${t.name}`,
                        callback: () => {
                            gameState.relationships[t.id] = (gameState.relationships[t.id] || 0) + g.relationship;
                            hideDialogue();
                            spawnEmote('🎁');
                            showNotification(`🎁 ${t.name} loved the ${g.name}! +${g.relationship} Bond`);
                            addJournalEntry(`Gave ${g.name} to ${t.name}. She seemed very happy!`);
                            updateHUD();
                            setTimeout(goToLobby, 2000);
                        }
                    })).concat([{ text: 'Nevermind', callback: () => { gameState.coins += g.price; hideDialogue(); goToLobby(); } }])
                );
            } else {
                hideDialogue();
                showNotification('❌ Not enough gold!');
                setTimeout(goToLobby, 1500);
            }
            updateHUD();
        }
    }));

    choices.push({ text: '← Back to Lobby', callback: () => { hideDialogue(); goToLobby(); } });

    showDialogue('Shop Keeper', 'Welcome to the Gift Shop! 🎁 A thoughtful gift can deepen your bond with any therapist. What catches your eye?', choices);
}

function viewJournal() {
    const entries = gameState.journalEntries.length > 0 
        ? gameState.journalEntries.slice(-5).reverse().join('\n\n📝 ')
        : 'No entries yet. Start your spa journey to fill your journal!';

    let statusText = '\n\n--- Relationships ---\n';
    therapists.forEach(t => {
        const rel = gameState.relationships[t.id] || 0;
        const hearts = '❤️'.repeat(Math.min(Math.floor(rel / 10), 5));
        const empty = '🤍'.repeat(5 - Math.min(Math.floor(rel / 10), 5));
        statusText += `${t.emoji} ${t.name}: ${hearts}${empty} (${rel})\n`;
    });

    showDialogue('📖 Your Journal', `Day ${gameState.day} | Chapter ${gameState.currentChapter}\n\n📝 ${entries}${statusText}`, [
        { text: 'Close Journal', callback: () => { hideDialogue(); } }
    ]);
}

function rest() {
    gameState.day++;
    gameState.stats.energy = 100;
    gameState.stats.relaxation = Math.max(0, gameState.stats.relaxation - 10);
    gameState.coins += 100;

    addJournalEntry(`Day ${gameState.day}: Rested well and feel energized for a new day at the spa.`);

    showNotification(`🌙 A new day begins! Day ${gameState.day} | +100 Gold`);
    updateHUD();
}

// ==========================================
// UI FUNCTIONS
// ==========================================

function showDialogue(speaker, text, choices) {
    const box = document.getElementById('dialogue-box');
    document.getElementById('speaker-name').textContent = speaker;
    document.getElementById('dialogue-text').textContent = '';
    document.getElementById('dialogue-choices').innerHTML = '';
    box.style.display = 'block';

    // Typewriter effect
    let index = 0;
    const textEl = document.getElementById('dialogue-text');
    const typeInterval = setInterval(() => {
        if(index < text.length) {
            textEl.textContent += text[index];
            index++;
        } else {
            clearInterval(typeInterval);
            // Show choices
            if(choices) {
                const choicesDiv = document.getElementById('dialogue-choices');
                choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = c.text;
                    btn.onclick = () => {
                        if(c.callback) c.callback();
                        else if(c.next !== undefined) {
                            // Handled elsewhere
                        }
                    };
                    choicesDiv.appendChild(btn);
                });
            }
        }
    }, 20);
}

function hideDialogue() {
    document.getElementById('dialogue-box').style.display = 'none';
}

function updateHUD() {
    document.getElementById('bar-relaxation').style.width = gameState.stats.relaxation + '%';
    document.getElementById('bar-satisfaction').style.width = gameState.stats.satisfaction + '%';
    document.getElementById('bar-energy').style.width = gameState.stats.energy + '%';
    document.getElementById('bar-mood').style.width = gameState.stats.mood + '%';
    document.getElementById('coins-display').textContent = `💰 ${gameState.coins} Gold`;
    document.getElementById('day-display').textContent = `Day ${gameState.day} | Ch.${gameState.currentChapter}`;
}

function showNotification(text) {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = text;
    document.getElementById('ui-overlay').appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
}

function spawnEmote(emoji) {
    const emote = document.createElement('div');
    emote.className = 'emote-particle';
    emote.textContent = emoji;
    emote.style.left = (window.innerWidth / 2 + (Math.random() - 0.5) * 200) + 'px';
    emote.style.top = (window.innerHeight / 2) + 'px';
    document.getElementById('ui-overlay').appendChild(emote);
    setTimeout(() => emote.remove(), 2000);
}

function addJournalEntry(entry) {
    gameState.journalEntries.push(entry);
}

function hexToCSS(hex) {
    const r = (hex >> 16) & 255;
    const g = (hex >> 8) & 255;
    const b = hex & 255;
    return `rgb(${r},${g},${b})`;
}

function showCredits() {
    showDialogue('About Serenity Spa', 'A narrative massage therapy simulation game. Build relationships with unique therapists, experience their stories, and find your inner peace. Each therapist has their own personality, backstory, and special massage techniques. Deepen your bonds through conversations and thoughtful gifts.\n\n🎮 Made with Three.js\n💜 A tasteful wellness experience', [
        { text: 'Close', callback: hideDialogue }
    ]);
}

initThreeJS();
buildLobbyScene();
animate();
